# Netlify build configuration.
#
# The build command, a pinned Node, two settings that narrow the secrets scan,
# and one header for the static files — and deliberately nothing else: the
# framework, the publish directory and the function bundling are all detected
# by the Next runtime, and a value restated here is one that can disagree with
# the manifest later.

[build]
  # Exactly what package.json defines. `prebuild` runs with it, so the image
  # manifest is regenerated on the host and a deployed build can never ship a
  # stale one.
  command = "npm run build"

[build.environment]
  # Pinned, because the host's default Node moves with its build image — and a
  # major version changing underneath a build is a failure that arrives on a
  # day nothing was pushed, with nothing in the diff to explain it.
  #
  # 22 is the line this project is developed on. Next 16 needs 20.9 or newer,
  # so that is the floor rather than the target: matching development is what
  # makes a green build here mean something about the build there.
  NODE_VERSION = "22"

  # The secrets scan: narrowed, never disabled.
  #
  # Netlify fails a build when the value of a variable marked "Contains secret
  # values" appears in the repository or in the build output. Both settings
  # below are exceptions to that check, which is why they are written here,
  # where the diff shows them with their reasons, and not in the Netlify UI.
  # SECRETS_SCAN_ENABLED = "false" would have fixed the first failure in one
  # line and thrown away the one check that matters: a secret reaching a page
  # that is served.

  # Turbopack's persistent build cache, new in Next 16, records the values of
  # environment variables read during the build. On the first production build
  # it was the only place ADMIN_SESSION_SECRET, GEMINI_API_KEY,
  # CLOUDINARY_API_KEY and CLOUDINARY_API_SECRET appeared. It is not served and
  # not uploaded to the CDN; the cache is saved separately.
  #
  # Each entry matches as a path prefix from the base directory: .next/cache/
  # is where Next writes the cache, and .netlify/.next/cache/ is where the scan
  # found it. Never widen this to .next as a whole — the served pages are
  # generated there, and that is exactly where a leaked secret would show up.
  # If the scan names any of those four again, it has reached something outside
  # this cache: a real finding, not noise.
  SECRETS_SCAN_OMIT_PATHS = ".netlify/.next/cache/,.next/cache/"

  # The cloud name is not a secret. It is the public identifier inside every
  # Cloudinary delivery URL, so it has to be in every page that shows an
  # uploaded painting, and it is in migration 008 and
  # scripts/check-image-crop.mjs, which the scan also covers. It was scanned
  # for only because it is marked secret in the Netlify UI, which is the wrong
  # label for it; this entry keeps that label from failing builds, even if the
  # variable is marked secret again later.
  #
  # The Cloudinary API key and API secret are real secrets and must never be
  # added here.
  SECRETS_SCAN_OMIT_KEYS = "CLOUDINARY_CLOUD_NAME"

# The one header the site's static files need, and the only header rule here.
#
# Every page, route and redirect gets its headers from next.config.mjs, because
# Netlify's own header rules never reach a response a function produced. The
# reverse is just as true, and was measured on the live site on 25-10-2026:
# the files Netlify serves from its own store — /_next/static (scripts, styles,
# fonts) and everything in public/ (the paintings, the hero video and poster,
# the wordmark) — carried none of next.config.mjs's headers. Rules here apply to
# exactly those files and nothing else, so this cannot double a header on a page.
#
# nosniff is the one that means anything on them: it stops a browser treating a
# file as a type other than the one it was served as. The rest of the security
# set is deliberately left off. The CSP and the framing headers govern
# documents, and no document is served from the store — every HTML, JSON and
# XML response was checked and comes from the function. X-Robots-Tag is left
# off too: robots.txt already forbids crawling these files before launch, and
# after launch a painting is meant to be found. See deployment.md.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
